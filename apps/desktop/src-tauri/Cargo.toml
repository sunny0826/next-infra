[package]
name = "next-infra-desktop-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "next-infra"

[[bin]]
name = "next-infra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
next-infra-core = { workspace = true }
next-infra-local-rpc = { workspace = true }
next-infra-query = { workspace = true }
next-infra-runtime = { workspace = true }
tauri = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
objc2 = { workspace = true }
objc2-local-authentication = { workspace = true }
security-framework = { workspace = true }
security-framework-sys = { workspace = true }
