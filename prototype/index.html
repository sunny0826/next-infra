<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Next Infra interaction prototype — a calm, evidence-first infrastructure atlas."
    />
    <title>Next Infra — Evidence-first infrastructure atlas</title>
    <style>
      :root {
        color-scheme: dark;
        --rack-canvas: #0d1115;
        --rack-surface: #11171c;
        --rack-raised: #151c22;
        --rack-hover: #182127;
        --rack-selected: #15242a;
        --aluminum-line: #29333b;
        --aluminum-strong: #3a4650;
        --label-primary: #e2e8ec;
        --label-secondary: #9ca8b1;
        --label-muted: #6f7b84;
        --telemetry-cyan: #4fc7dc;
        --telemetry-cyan-soft: #1b6572;
        --heartbeat-green: #69c58b;
        --inspection-amber: #e2b55e;
        --fault-vermilion: #ef715f;
        --cloud-unknown: #75899a;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --radius-control: 3px;
        --radius-panel: 4px;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--rack-canvas);
        color: var(--label-primary);
        font-family: var(--font-ui);
        font-size: 13px;
      }

      button,
      input,
      select {
        color: inherit;
        font: inherit;
      }

      button,
      select {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      [tabindex="0"]:focus-visible {
        outline: 2px solid var(--telemetry-cyan);
        outline-offset: -2px;
      }

      .icon {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        stroke-width: 1.6;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 188px minmax(0, 1fr) 316px;
        grid-template-rows: 52px minmax(0, 1fr) 29px;
        width: 100vw;
        height: 100vh;
        min-width: 320px;
      }

      .sidebar {
        grid-column: 1;
        grid-row: 1 / 4;
        display: flex;
        min-height: 0;
        flex-direction: column;
        border-right: 1px solid var(--aluminum-line);
        background: #0f1418;
      }

      .brand {
        display: flex;
        height: 52px;
        align-items: center;
        gap: 10px;
        padding: 0 var(--space-4);
        border-bottom: 1px solid var(--aluminum-line);
        letter-spacing: -0.01em;
        font-weight: 650;
      }

      .brand-mark {
        display: grid;
        width: 23px;
        height: 23px;
        place-items: center;
        border: 1px solid var(--telemetry-cyan-soft);
        border-radius: 3px;
        color: var(--telemetry-cyan);
      }

      .sidebar-nav {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 2px;
        padding: 12px 8px;
      }

      .nav-button {
        display: flex;
        width: 100%;
        height: 35px;
        align-items: center;
        gap: 10px;
        padding: 0 9px;
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        background: transparent;
        color: var(--label-secondary);
        text-align: left;
      }

      .nav-button:hover {
        background: var(--rack-hover);
        color: var(--label-primary);
      }

      .nav-button.active {
        border-color: #24444b;
        background: var(--rack-selected);
        color: var(--telemetry-cyan);
      }

      .sidebar-foot {
        display: grid;
        gap: 2px;
        padding: 12px 16px 14px;
        border-top: 1px solid var(--aluminum-line);
      }

      .sidebar-foot strong {
        font-size: 12px;
        font-weight: 600;
      }

      .sidebar-foot span {
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .context-bar {
        grid-column: 2 / 4;
        grid-row: 1;
        display: grid;
        grid-template-columns: minmax(160px, 1fr) minmax(240px, 390px) minmax(180px, 1fr);
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        border-bottom: 1px solid var(--aluminum-line);
        background: #10161a;
      }

      .context-scope {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        color: var(--label-secondary);
      }

      .context-scope strong {
        overflow: hidden;
        color: var(--label-primary);
        font-size: 12px;
        font-weight: 550;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .search-wrap {
        position: relative;
      }

      .global-search {
        display: flex;
        height: 30px;
        align-items: center;
        gap: 8px;
        padding: 0 9px;
        border: 1px solid var(--aluminum-strong);
        border-radius: var(--radius-control);
        background: var(--rack-canvas);
        color: var(--label-muted);
      }

      .global-search:focus-within {
        border-color: var(--telemetry-cyan-soft);
        outline: 1px solid var(--telemetry-cyan-soft);
        outline-offset: -2px;
      }

      .global-search input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--label-primary);
        font-size: 12px;
      }

      .shortcut {
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 10px;
        white-space: nowrap;
      }

      .search-results {
        position: absolute;
        z-index: 20;
        top: 35px;
        left: 0;
        width: 100%;
        padding: 4px;
        border: 1px solid var(--aluminum-strong);
        border-radius: var(--radius-panel);
        background: #11181d;
      }

      .search-results[hidden] {
        display: none;
      }

      .search-result {
        display: grid;
        width: 100%;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 8px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--label-primary);
        text-align: left;
      }

      .search-result:hover {
        background: var(--rack-hover);
      }

      .search-result small {
        color: var(--label-muted);
        font-family: var(--font-mono);
      }

      .context-status {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 10px;
        white-space: nowrap;
      }

      .live-read {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--heartbeat-green);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      .main-canvas {
        grid-column: 2;
        grid-row: 2;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        background: var(--rack-canvas);
      }

      .page {
        min-width: 700px;
        padding: 18px 20px 28px;
      }

      .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 17px;
      }

      .page-title-group {
        min-width: 0;
      }

      .eyebrow {
        margin-bottom: 4px;
        color: var(--telemetry-cyan);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        font-weight: 620;
        letter-spacing: -0.02em;
      }

      .page-header p {
        margin-top: 5px;
        color: var(--label-secondary);
        font-size: 12px;
      }

      .page-actions,
      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .control,
      .control-button {
        height: 29px;
        border: 1px solid var(--aluminum-line);
        border-radius: var(--radius-control);
        background: var(--rack-surface);
        color: var(--label-secondary);
        font-size: 11px;
      }

      .control {
        padding: 0 26px 0 9px;
      }

      .control-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 10px;
      }

      .control-button:hover,
      .control:hover {
        border-color: var(--aluminum-strong);
        background: var(--rack-hover);
        color: var(--label-primary);
      }

      .control-button.primary {
        border-color: #28606b;
        background: #15323a;
        color: var(--telemetry-cyan);
      }

      .control-button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .section {
        margin-top: 20px;
      }

      .section:first-of-type {
        margin-top: 0;
      }

      .section-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 7px;
      }

      .section-heading h2 {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .section-heading span,
      .section-heading button {
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 9px;
      }

      .section-heading button {
        border: 0;
        background: transparent;
      }

      .section-heading button:hover {
        color: var(--telemetry-cyan);
      }

      .data-frame {
        overflow: hidden;
        border: 1px solid var(--aluminum-line);
        border-radius: var(--radius-panel);
        background: var(--rack-surface);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th {
        height: 30px;
        padding: 0 10px;
        border-bottom: 1px solid var(--aluminum-line);
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.035em;
        text-align: left;
        text-transform: uppercase;
      }

      td {
        height: 40px;
        padding: 0 10px;
        border-bottom: 1px solid #212a31;
        color: var(--label-secondary);
        font-size: 11px;
        vertical-align: middle;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      tbody tr.selectable {
        cursor: pointer;
      }

      tbody tr.selectable:hover td {
        background: var(--rack-hover);
      }

      tbody tr.selectable.selected td {
        background: var(--rack-selected);
      }

      tbody tr.selectable.selected td:first-child {
        border-left: 2px solid var(--telemetry-cyan);
      }

      .cell-primary {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        color: var(--label-primary);
        font-weight: 520;
      }

      .cell-primary span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .kind-icon {
        color: var(--label-muted);
      }

      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .badge {
        display: inline-flex;
        min-height: 19px;
        align-items: center;
        gap: 5px;
        padding: 1px 6px;
        border: 1px solid currentColor;
        border-radius: 2px;
        font-family: var(--font-mono);
        font-size: 9px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .badge::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .good {
        color: var(--heartbeat-green);
      }

      .warn {
        color: var(--inspection-amber);
      }

      .bad {
        color: var(--fault-vermilion);
      }

      .unknown {
        color: var(--cloud-unknown);
      }

      .cyan {
        color: var(--telemetry-cyan);
      }

      .issue-label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
      }

      .issue-mark {
        width: 3px;
        height: 20px;
        border-radius: 1px;
        background: currentColor;
      }

      .observation-strip {
        display: grid;
        grid-template-columns: repeat(5, minmax(116px, 1fr));
        overflow: auto;
        border: 1px solid var(--aluminum-line);
        border-radius: var(--radius-panel);
        background: var(--rack-surface);
      }

      .observation {
        min-width: 116px;
        padding: 10px 11px;
        border-right: 1px solid var(--aluminum-line);
      }

      .observation:last-child {
        border-right: 0;
      }

      .observation-name {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        color: var(--label-primary);
        font-size: 10px;
        font-weight: 600;
      }

      .observation-time {
        color: var(--label-secondary);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .observation-meta {
        margin-top: 4px;
        color: var(--label-muted);
        font-size: 9px;
      }

      .critical-path {
        display: grid;
        grid-template-columns: minmax(118px, 1fr) 24px minmax(118px, 1fr) 24px minmax(118px, 1fr) 24px minmax(118px, 1fr);
        align-items: stretch;
        min-width: 620px;
        padding: 12px;
        border: 1px solid var(--aluminum-line);
        border-radius: var(--radius-panel);
        background: var(--rack-surface);
      }

      .path-node {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        padding: 9px;
        border: 1px solid var(--aluminum-line);
        border-radius: 3px;
        background: var(--rack-canvas);
        color: var(--label-primary);
        text-align: left;
      }

      .path-node:hover {
        border-color: var(--telemetry-cyan-soft);
      }

      .path-copy {
        min-width: 0;
      }

      .path-copy strong,
      .path-copy small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .path-copy strong {
        font-size: 10px;
        font-weight: 600;
      }

      .path-copy small {
        margin-top: 3px;
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 8px;
      }

      .path-edge {
        position: relative;
      }

      .path-edge::before,
      .path-edge::after {
        position: absolute;
        top: 50%;
        content: "";
      }

      .path-edge::before {
        left: 3px;
        width: 16px;
        border-top: 1px solid var(--cloud-unknown);
      }

      .path-edge::after {
        right: 3px;
        width: 5px;
        height: 5px;
        border-top: 1px solid var(--cloud-unknown);
        border-right: 1px solid var(--cloud-unknown);
        transform: translateY(-2px) rotate(45deg);
      }

      .inspector {
        grid-column: 3;
        grid-row: 2;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        border-left: 1px solid var(--aluminum-line);
        background: #10161a;
      }

      .inspector.hidden {
        display: none;
      }

      .app-shell.inspector-closed {
        grid-template-columns: 188px minmax(0, 1fr) 0;
      }

      .inspector-head {
        position: sticky;
        z-index: 2;
        top: 0;
        display: flex;
        height: 45px;
        align-items: center;
        justify-content: space-between;
        padding: 0 13px;
        border-bottom: 1px solid var(--aluminum-line);
        background: #10161a;
      }

      .inspector-head h2 {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .icon-button {
        display: grid;
        width: 27px;
        height: 27px;
        place-items: center;
        border: 1px solid transparent;
        border-radius: 2px;
        background: transparent;
        color: var(--label-muted);
      }

      .icon-button:hover {
        border-color: var(--aluminum-line);
        color: var(--label-primary);
      }

      .inspector-body {
        padding: 14px 14px 28px;
      }

      .inspect-kicker {
        color: var(--telemetry-cyan);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .inspect-title {
        margin-top: 5px;
        font-size: 15px;
        font-weight: 620;
        line-height: 1.35;
      }

      .inspect-subtitle {
        margin-top: 4px;
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 9px;
        line-height: 1.5;
      }

      .inspect-summary {
        margin-top: 12px;
        padding: 10px;
        border: 1px solid var(--aluminum-line);
        border-radius: 3px;
        background: var(--rack-surface);
        color: var(--label-secondary);
        font-size: 10px;
        line-height: 1.55;
      }

      .inspect-section {
        margin-top: 18px;
      }

      .inspect-section h3 {
        margin-bottom: 8px;
        color: var(--label-muted);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .fact-list {
        display: grid;
        gap: 7px;
      }

      .fact-row {
        display: grid;
        grid-template-columns: minmax(86px, 0.8fr) minmax(0, 1.25fr);
        gap: 10px;
        align-items: baseline;
      }

      .fact-row dt,
      .fact-row dd {
        margin: 0;
        font-size: 10px;
      }

      .fact-row dt {
        color: var(--label-muted);
      }

      .fact-row dd {
        overflow-wrap: anywhere;
        color: var(--label-secondary);
        font-family: var(--font-mono);
        text-align: right;
      }

      .spine {
        position: relative;
        display: grid;
        gap: 0;
        padding-left: 21px;
      }

      .spine::before {
        position: absolute;
        top: 8px;
        bottom: 10px;
        left: 6px;
        border-left: 1px solid var(--aluminum-strong);
        content: "";
      }

      .spine-step {
        position: relative;
        padding: 0 0 15px;
      }

      .spine-step:last-child {
        padding-bottom: 0;
      }

      .spine-step::before {
        position: absolute;
        top: 3px;
        left: -18px;
        width: 7px;
        height: 7px;
        border: 1px solid var(--telemetry-cyan-soft);
        border-radius: 50%;
        background: var(--rack-surface);
        content: "";
      }

      .spine-step.active::before {
        background: var(--telemetry-cyan);
      }

      .spine-label {
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 8px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .spine-value {
        margin-top: 3px;
        color: var(--label-primary);
        font-size: 10px;
        line-height: 1.45;
      }

      .spine-meta {
        margin-top: 2px;
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 8px;
        line-height: 1.45;
      }

      .runtime-bar {
        grid-column: 2 / 4;
        grid-row: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 12px;
        border-top: 1px solid var(--aluminum-line);
        background: #0c1114;
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 9px;
        white-space: nowrap;
      }

      .runtime-cluster {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .runtime-state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--heartbeat-green);
      }

      .filters {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 9px;
        flex-wrap: wrap;
      }

      .filter-button {
        height: 26px;
        padding: 0 9px;
        border: 1px solid var(--aluminum-line);
        border-radius: 2px;
        background: transparent;
        color: var(--label-muted);
        font-size: 10px;
      }

      .filter-button:hover,
      .filter-button.active {
        border-color: var(--telemetry-cyan-soft);
        background: var(--rack-selected);
        color: var(--telemetry-cyan);
      }

      .result-summary {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 10px;
        border: 1px solid var(--aluminum-line);
        border-bottom: 0;
        border-radius: 3px 3px 0 0;
        background: #10161a;
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 9px;
      }

      .topology-shell {
        position: relative;
        height: min(680px, calc(100vh - 154px));
        min-height: 480px;
        overflow: hidden;
        border: 1px solid var(--aluminum-line);
        border-radius: var(--radius-panel);
        background-color: #0c1115;
      }

      .topology-canvas {
        width: 100%;
        height: 100%;
      }

      .topology-edge {
        fill: none;
        stroke: #64737d;
        stroke-width: 1.3;
        marker-end: url(#arrow);
      }

      .topology-edge.configured {
        stroke-width: 1;
      }

      .topology-edge.configured.secondary {
        marker-end: none;
      }

      .topology-edge.inferred {
        stroke-dasharray: 6 5;
      }

      .topology-edge.selected {
        stroke: var(--telemetry-cyan);
        stroke-width: 2;
      }

      .topology-node rect {
        fill: #11181d;
        stroke: #3a4750;
        stroke-width: 1;
        rx: 3;
      }

      .topology-node:hover rect,
      .topology-node:focus rect,
      .topology-node.selected rect {
        fill: #132127;
        stroke: var(--telemetry-cyan);
      }

      .topology-node .node-name {
        fill: #dce4e8;
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 600;
      }

      .topology-node .node-kind {
        fill: #74818a;
        font-family: var(--font-mono);
        font-size: 8px;
      }

      .topology-node .node-status {
        fill: var(--heartbeat-green);
      }

      .topology-node .node-status.warn-fill {
        fill: var(--inspection-amber);
      }

      .topology-node .node-status.bad-fill {
        fill: var(--fault-vermilion);
      }

      .edge-hit {
        cursor: pointer;
        fill: none;
        stroke: transparent;
        stroke-width: 14;
      }

      .edge-label {
        fill: #7f8c94;
        font-family: var(--font-mono);
        font-size: 8px;
      }

      .topology-legend {
        position: absolute;
        right: 11px;
        bottom: 11px;
        display: flex;
        gap: 12px;
        padding: 7px 9px;
        border: 1px solid var(--aluminum-line);
        border-radius: 3px;
        background: rgba(13, 17, 21, 0.94);
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 8px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .legend-line {
        width: 18px;
        border-top: 1px solid var(--cloud-unknown);
      }

      .legend-line.double {
        height: 4px;
        border-top-width: 1px;
        border-bottom: 1px solid var(--cloud-unknown);
      }

      .legend-line.dashed {
        border-top-style: dashed;
      }

      .frontier-note {
        position: absolute;
        left: 11px;
        bottom: 11px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border: 1px solid #68552e;
        border-radius: 3px;
        background: #1e1a12;
        color: var(--inspection-amber);
        font-size: 9px;
      }

      .timeline {
        border-top: 1px solid var(--aluminum-line);
      }

      .timeline-group {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        border-bottom: 1px solid var(--aluminum-line);
      }

      .timeline-date {
        padding: 14px 12px;
        border-right: 1px solid var(--aluminum-line);
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 9px;
      }

      .timeline-events {
        padding: 5px 0;
      }

      .timeline-event {
        display: grid;
        width: 100%;
        grid-template-columns: 63px 90px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        padding: 9px 12px;
        border: 0;
        border-left: 2px solid transparent;
        background: transparent;
        color: var(--label-secondary);
        text-align: left;
      }

      .timeline-event:hover,
      .timeline-event.selected {
        border-left-color: var(--telemetry-cyan);
        background: var(--rack-hover);
      }

      .timeline-event .origin,
      .timeline-event time {
        color: var(--label-muted);
        font-family: var(--font-mono);
        font-size: 9px;
      }

      .change-path {
        color: var(--label-primary);
        font-family: var(--font-mono);
        font-size: 9px;
      }

      .coverage-matrix th:not(:first-child),
      .coverage-matrix td:not(:first-child) {
        text-align: center;
      }

      .coverage-state {
        font-family: var(--font-mono);
        font-size: 9px;
      }

      .settings-list {
        border-top: 1px solid var(--aluminum-line);
      }

      .settings-row {
        display: grid;
        grid-template-columns: minmax(240px, 1fr) minmax(180px, auto);
        align-items: center;
        gap: 24px;
        min-height: 62px;
        padding: 10px 2px;
        border-bottom: 1px solid var(--aluminum-line);
      }

      .settings-copy strong {
        display: block;
        font-size: 11px;
        font-weight: 600;
      }

      .settings-copy p {
        margin-top: 4px;
        color: var(--label-muted);
        font-size: 10px;
        line-height: 1.45;
      }

      .settings-control {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
      }

      .switch {
        position: relative;
        display: inline-flex;
        width: 34px;
        height: 19px;
        padding: 0;
        border: 1px solid var(--aluminum-strong);
        border-radius: 10px;
        background: var(--rack-surface);
      }

      .switch::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--label-muted);
        content: "";
        transition: transform 120ms ease, background 120ms ease;
      }

      .switch[aria-checked="true"] {
        border-color: var(--telemetry-cyan-soft);
        background: #153139;
      }

      .switch[aria-checked="true"]::after {
        background: var(--telemetry-cyan);
        transform: translateX(15px);
      }

      .notice {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-bottom: 15px;
        padding: 10px 11px;
        border: 1px solid #5c4c2c;
        border-radius: 3px;
        background: #1b1812;
        color: var(--inspection-amber);
        font-size: 10px;
        line-height: 1.5;
      }

      .toast {
        position: fixed;
        z-index: 50;
        right: 18px;
        bottom: 43px;
        max-width: 320px;
        padding: 10px 12px;
        border: 1px solid var(--telemetry-cyan-soft);
        border-radius: 3px;
        background: #112127;
        color: var(--label-primary);
        font-size: 10px;
      }

      .toast[hidden] {
        display: none;
      }

      .empty-state {
        display: grid;
        min-height: 220px;
        place-items: center;
        padding: 30px;
        border: 1px solid var(--aluminum-line);
        color: var(--label-secondary);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        color: var(--label-primary);
        font-size: 12px;
      }

      .empty-state span {
        display: block;
        margin-top: 6px;
        color: var(--label-muted);
        font-size: 10px;
      }

      @media (max-width: 1180px) {
        .app-shell,
        .app-shell.inspector-closed {
          grid-template-columns: 188px minmax(0, 1fr);
        }

        .context-bar,
        .runtime-bar {
          grid-column: 2;
        }

        .context-bar {
          grid-template-columns: minmax(140px, 0.75fr) minmax(260px, 1.25fr);
          gap: 10px;
        }

        .context-status {
          display: none;
        }

        .inspector {
          position: fixed;
          z-index: 30;
          top: 52px;
          right: 0;
          bottom: 29px;
          width: 316px;
          border-left: 1px solid var(--aluminum-strong);
        }
      }

      @media (max-width: 820px) {
        .app-shell,
        .app-shell.inspector-closed {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .brand {
          justify-content: center;
          padding: 0;
        }

        .brand-name,
        .nav-label,
        .sidebar-foot {
          display: none;
        }

        .sidebar-nav {
          padding: 10px 6px;
        }

        .nav-button {
          justify-content: center;
          padding: 0;
        }

        .context-bar {
          grid-template-columns: minmax(140px, 1fr) minmax(220px, 1.3fr);
          gap: 9px;
          padding: 0 10px;
        }

        .context-status {
          display: none;
        }

        .runtime-bar {
          overflow: hidden;
        }

        .runtime-cluster:last-child {
          display: none;
        }
      }

      @media (max-width: 560px) {
        .context-bar {
          grid-template-columns: 1fr;
        }

        .context-scope {
          display: none;
        }

        .page {
          min-width: 0;
          padding: 14px 14px 24px;
        }

        .page-header {
          display: grid;
        }

        .data-frame {
          overflow-x: auto;
        }

        .data-frame table {
          min-width: 660px;
        }

        .critical-path {
          min-width: 0;
          grid-template-columns: minmax(0, 1fr);
          gap: 6px;
        }

        .path-edge {
          display: none;
        }

        .observation-strip {
          grid-template-columns: repeat(5, 148px);
        }

        .topology-shell {
          overflow: auto;
        }

        .topology-canvas {
          min-width: 660px;
        }

        .timeline-group {
          grid-template-columns: 1fr;
        }

        .timeline-date {
          border-right: 0;
          border-bottom: 1px solid var(--aluminum-line);
        }

        .timeline-event {
          min-width: 620px;
        }

        .settings-row {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .settings-control {
          justify-content: flex-start;
        }

        .inspector {
          left: 56px;
          width: auto;
        }

        .runtime-cluster span:not(.runtime-state) {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

        topologyDepth: 1,
        topologyExpanded: false,
        syncStatus: "idle",
        settings: { login: true, mcp: false },
        searchQuery: ""
      };

      const contextLabels = {
        overview: "All infrastructure",
        inventory: "Resource inventory",
        topology: "Topology · atlas-web",
        timeline: "Change timeline",
        connectors: "Connections & coverage",
        settings: "Local settings"
      };

      function semanticClass(value) {
        if (["healthy", "fresh", "supported", "active", "succeeded"].includes(value)) return "good";
        if (["degraded", "stale", "expired", "partial", "tombstoned", "running"].includes(value)) return "warn";
        if (["unhealthy", "unreachable", "auth_failed", "failed"].includes(value)) return "bad";
        return "unknown";
      }

      function badge(value, label = value) {
        return `<span class="badge ${semanticClass(value)}">${label}</span>`;
      }

      function pageHeader(eyebrow, title, description, actions = "") {
        return `<div class="page-header">
          <div class="page-title-group"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>
          ${actions ? `<div class="page-actions">${actions}</div>` : ""}
        </div>`;
      }

      function renderOverview() {
        return `<div class="page">
          ${pageHeader("Snapshot v1842 · 2026-08-02 10:42:18 +08:00", "Overview", "Start with facts that need a decision, then follow their evidence.", `<button class="control-button" data-view-target="inventory">Open inventory ${icon("arrow")}</button>`)}

          <section class="section">
            <div class="section-heading"><h2>Needs attention</h2><span>4 facts · ordered by decision value</span></div>
            <div class="data-frame">
              <table aria-label="Attention queue">
                <colgroup><col style="width: 29%"><col style="width: 23%"><col style="width: 19%"><col style="width: 18%"><col style="width: 11%"></colgroup>
                <thead><tr><th>Issue</th><th>Resource</th><th>Dimension</th><th>Last observation</th><th>Age</th></tr></thead>
                <tbody>
                  ${issues.map((issue) => {
                    const resource = resources.find((item) => item.id === issue.resourceId);
                    const selected = state.selected.type === "issue" && state.selected.id === issue.id;
                    return `<tr class="selectable ${selected ? "selected" : ""}" tabindex="0" data-select-type="issue" data-select-id="${issue.id}">
                      <td><span class="issue-label ${issue.severity}"><span class="issue-mark"></span><span><strong style="display:block;color:var(--label-primary);font-size:10px">${issue.issue}</strong><small style="color:var(--label-muted)">${issue.detail}</small></span></span></td>
                      <td><span class="cell-primary">${icon(resource.icon, "kind-icon")}<span>${resource.name}</span></span></td>
                      <td>${issue.dimension}</td><td class="mono">${resource.observed}</td><td class="mono">${issue.age}</td>
                    </tr>`;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </section>

          <section class="section">
            <div class="section-heading"><h2>Observation strip</h2><span>Connection Health is independent from Resource Health</span></div>
            <div class="observation-strip">
              ${connections.map((connection) => `<button class="observation" style="text-align:left;border-top:0;border-bottom:0;background:transparent;color:inherit" data-select-type="connection" data-select-id="${connection.id}">
                <span class="observation-name"><span>${connection.connector}</span>${badge(connection.health)}</span>
                <span class="observation-time">${connection.lastSuccess}</span>
                <span class="observation-meta">next ${connection.next} · ${connection.coverage}</span>
              </button>`).join("")}
            </div>
          </section>

          <section class="section">
            <div class="section-heading"><h2>Critical path</h2><button data-view-target="topology">Inspect topology →</button></div>
            <div class="critical-path" aria-label="Pinned critical path">
              ${pathNode("repo", "atlas-web", "github.repository", "repo")}
              <span class="path-edge"></span>
              ${pathNode("workflow", "deploy-production", "github.workflow", "workflow")}
              <span class="path-edge"></span>
              ${pathNode("app", "atlas-web", "dokploy.application", "server")}
              <span class="path-edge"></span>
              ${pathNode("host", "mac-mini-build", "ssh.host · expired", "laptop")}
            </div>
          </section>

          <section class="section">
            <div class="section-heading"><h2>Recent changes</h2><button data-view-target="timeline">Open timeline →</button></div>
            <div class="data-frame">
              <table aria-label="Recent structured changes">
                <colgroup><col style="width: 18%"><col style="width: 29%"><col style="width: 37%"><col style="width: 16%"></colgroup>
                <thead><tr><th>Observed</th><th>Resource</th><th>Structured change</th><th>Origin</th></tr></thead>
                <tbody>${changes.slice(0, 3).map((change) => {
                  const resource = resources.find((item) => item.id === change.resourceId);
                  return `<tr class="selectable" tabindex="0" data-select-type="change" data-select-id="${change.id}">
                    <td class="mono">${change.time}</td><td><span class="cell-primary">${icon(resource.icon, "kind-icon")}<span>${resource.name}</span></span></td>
                    <td><span class="change-path">${change.path}</span> · ${change.before} → ${change.after}</td><td>${change.origin} ${change.run}</td>
                  </tr>`;
                }).join("")}</tbody>
              </table>
            </div>
          </section>
        </div>`;
      }

      function pathNode(id, name, kind, iconName) {
        return `<button class="path-node" data-select-type="resource" data-select-id="${id}">${icon(iconName, "kind-icon")}<span class="path-copy"><strong>${name}</strong><small>${kind}</small></span></button>`;
      }

      function renderInventory() {
        const visible = state.inventoryFilter === "all"
          ? resources
          : resources.filter((resource) => resource.freshness === state.inventoryFilter || resource.health === state.inventoryFilter || resource.lifecycle === state.inventoryFilter);
        return `<div class="page">
          ${pageHeader("Committed projection · 8 resources", "Inventory", "Search and compare normalized resources without opening provider consoles.", `<button class="control-button" data-view-target="topology">Focused topology ${icon("arrow")}</button>`)}
          <div class="filters" aria-label="Inventory filters">
            ${["all", "healthy", "degraded", "stale", "expired", "tombstoned"].map((filter) => `<button class="filter-button ${state.inventoryFilter === filter ? "active" : ""}" data-filter="${filter}">${filter}</button>`).join("")}
          </div>
          <div class="result-summary"><span>${visible.length} matching resources · page 1 of 1</span><span>hard limit 100 / query</span></div>
          <div class="data-frame" style="border-radius:0 0 4px 4px">
            ${visible.length ? `<table aria-label="Resource inventory">
              <colgroup><col style="width: 21%"><col style="width: 20%"><col style="width: 12%"><col style="width: 12%"><col style="width: 15%"><col style="width: 12%"><col style="width: 8%"></colgroup>
              <thead><tr><th>Name</th><th>Kind</th><th>Health</th><th>Freshness</th><th>Connection</th><th>Observed</th><th>Lifecycle</th></tr></thead>
              <tbody>${visible.map((resource) => `<tr class="selectable ${state.selected.type === "resource" && state.selected.id === resource.id ? "selected" : ""}" tabindex="0" data-select-type="resource" data-select-id="${resource.id}">
                <td><span class="cell-primary">${icon(resource.icon, "kind-icon")}<span>${resource.name}</span></span></td><td class="mono">${resource.kind}</td>
                <td>${badge(resource.health, resource.health)}</td><td>${badge(resource.freshness, resource.freshness)}</td><td>${resource.connection}</td><td class="mono">${resource.observed}</td><td class="mono ${semanticClass(resource.lifecycle)}">${resource.lifecycle}</td>
              </tr>`).join("")}</tbody>
            </table>` : `<div class="empty-state"><div><strong>No resources match “${state.inventoryFilter}”</strong><span>The query succeeded. Change the current filter to continue.</span></div></div>`}
          </div>
        </div>`;
      }

      function renderTopology() {
        const count = state.topologyExpanded ? "8 nodes · 8 edges" : "7 nodes · 7 edges";
        return `<div class="page">
          ${pageHeader("Focus-centered relation graph", "Topology", "One-hop context for atlas-web. Evidence belongs to edges, not node color.", `<select class="control" id="depth-control" aria-label="Topology depth"><option value="1" ${state.topologyDepth === 1 ? "selected" : ""}>Depth 1</option><option value="2" ${state.topologyDepth === 2 ? "selected" : ""}>Depth 2</option></select><span class="control-button" style="cursor:default">${count}</span><span class="control-button" style="cursor:default">observed 18 sec ago</span>`)}
          <div class="topology-shell">
            <svg class="topology-canvas" viewBox="0 0 920 570" role="img" aria-label="Focused infrastructure topology">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64737d"></path></marker>
                <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#273139"></circle></pattern>
              </defs>
              <rect width="920" height="570" fill="url(#dot-grid)"></rect>
              ${topologyEdge("repo-workflow", 189, 180, 284, 180, "triggers", "provider")}
              ${topologyEdge("workflow-image", 425, 180, 520, 180, "publishes", "provider")}
              ${topologyEdge("image-app", 661, 180, 742, 262, "deploys", "provider")}
              ${topologyEdge("app-host", 742, 326, 640, 413, "runs on", "configured")}
              ${topologyEdge("dns-app", 192, 402, 720, 312, "routes to", "configured")}
              ${topologyEdge("repo-database", 150, 207, 336, 423, "depends on", "inferred")}
              ${topologyEdge("database-app", 476, 451, 720, 323, "service endpoint", "provider")}
              ${state.topologyExpanded ? topologyEdge("host-frontier", 640, 445, 735, 492, "build target", "inferred") : ""}
              ${topologyNode("repo", 55, 148, "atlas-web", "github.repository", "repo", "good")}
              ${topologyNode("workflow", 284, 148, "deploy-production", "github.workflow", "workflow", "good")}
              ${topologyNode("image", 520, 148, "atlas-web:7f3c9d1", "container_image", "cube", "good")}
              ${topologyNode("app", 720, 262, "atlas-web", "dokploy.application", "server", "bad")}
              ${topologyNode("host", 505, 413, "mac-mini-build", "ssh.host · expired", "laptop", "warn")}
              ${topologyNode("dns", 55, 370, "edge.example.dev", "cloudflare.dns_record", "globe", "warn")}
              ${topologyNode("database", 336, 423, "supabase-prod", "supabase.project", "inventory", "good")}
              ${state.topologyExpanded ? topologyNode("runner", 735, 468, "runner-legacy", "ssh.host · tombstoned", "laptop", "warn") : ""}
            </svg>
            <div class="frontier-note">${icon("alert")}<span>${state.topologyExpanded ? "Depth 2 shown · 2 frontier nodes remain" : "Graph truncated at depth 1 · 4 frontier nodes"}</span><button class="control-button" id="expand-frontier" style="height:23px">${state.topologyExpanded ? "Expanded" : "Expand frontier"}</button></div>
            <div class="topology-legend" aria-label="Relation evidence legend"><span class="legend-item"><span class="legend-line"></span>provider</span><span class="legend-item"><span class="legend-line double"></span>configured</span><span class="legend-item"><span class="legend-line dashed"></span>inferred</span></div>
          </div>
        </div>`;
      }

      function topologyNode(id, x, y, name, kind, iconName, tone) {
        const selected = state.topologySelection.type === "node" && state.topologySelection.id === id;
        const symbol = { repo: "R", workflow: "W", cube: "I", server: "A", laptop: "H", globe: "D", inventory: "S" }[iconName] || "R";
        return `<g class="topology-node ${selected ? "selected" : ""}" tabindex="0" role="button" aria-label="${name}, ${kind}" data-topology-type="node" data-topology-id="${id}" transform="translate(${x} ${y})">
          <rect width="136" height="64"></rect><text x="12" y="25" class="node-name">${symbol}  ${name}</text><text x="12" y="44" class="node-kind">${kind}</text><circle cx="123" cy="13" r="3" class="node-status ${tone === "warn" ? "warn-fill" : tone === "bad" ? "bad-fill" : ""}"></circle>
        </g>`;
      }

      function topologyEdge(id, x1, y1, x2, y2, label, evidence) {
        const selected = state.topologySelection.type === "edge" && state.topologySelection.id === id;
        const mx = Math.round((x1 + x2) / 2);
        const my = Math.round((y1 + y2) / 2) - 7;
        const length = Math.hypot(x2 - x1, y2 - y1) || 1;
        const offsetX = -((y2 - y1) / length) * 2;
        const offsetY = ((x2 - x1) / length) * 2;
        const lines = evidence === "configured"
          ? `<line class="topology-edge configured secondary ${selected ? "selected" : ""}" x1="${x1 + offsetX}" y1="${y1 + offsetY}" x2="${x2 + offsetX}" y2="${y2 + offsetY}"></line><line class="topology-edge configured ${selected ? "selected" : ""}" x1="${x1 - offsetX}" y1="${y1 - offsetY}" x2="${x2 - offsetX}" y2="${y2 - offsetY}"></line>`
          : `<line class="topology-edge ${evidence} ${selected ? "selected" : ""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
        return `<g data-topology-type="edge" data-topology-id="${id}" tabindex="0" role="button" aria-label="${label}, ${evidence} evidence">${lines}<line class="edge-hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line><text class="edge-label" x="${mx}" y="${my}" text-anchor="middle">${label} · ${evidence}</text></g>`;
      }

      function renderTimeline() {
        return `<div class="page">
          ${pageHeader("Structured changes · local timezone", "Timeline", "Committed ResourceVersion and RelationVersion changes, grouped by origin.", `<span class="control-button" style="cursor:default">2026-08-02</span><button class="control-button">Filter origin</button>`)}
          <div class="notice">${icon("clock")}<span>Polling without semantic changes is intentionally omitted. Times use Asia/Shanghai; absolute timestamps remain available in Evidence Spine.</span></div>
          <div class="timeline" aria-label="Change timeline">
            <div class="timeline-group">
              <div class="timeline-date">Today<br><strong style="color:var(--label-secondary);line-height:2">10:00 — now</strong></div>
              <div class="timeline-events">
                ${changes.slice(0, 2).map(timelineEvent).join("")}
              </div>
            </div>
            <div class="timeline-group">
              <div class="timeline-date">Today<br><strong style="color:var(--label-secondary);line-height:2">08:00 — 10:00</strong></div>
              <div class="timeline-events">
                ${changes.slice(2).map(timelineEvent).join("")}
              </div>
            </div>
          </div>
        </div>`;
      }

      function timelineEvent(change) {
        const selected = state.selected.type === "change" && state.selected.id === change.id;
        return `<button class="timeline-event ${selected ? "selected" : ""}" data-select-type="change" data-select-id="${change.id}"><time>${change.time}</time><span class="origin">${change.origin} ${change.run}</span><span><strong style="display:block;color:var(--label-primary);font-size:10px">${change.summary}</strong><span class="change-path">${change.path}</span></span><span class="mono">${change.before} → ${change.after}</span></button>`;
      }

      function renderConnectors() {
        const syncing = state.syncStatus === "running";
        return `<div class="page">
          ${pageHeader("Read-only provider adapters", "Connectors", "Connection health, retry state and capability coverage remain separately inspectable.", `<button class="control-button primary" id="manual-sync" ${syncing ? "disabled" : ""}>${icon("refresh")} ${syncing ? "SyncRun #1843 running" : "Manual sync all"}</button>`)}
          ${syncing ? `<div class="notice">${icon("refresh")}<span><strong>SyncRun #1843 is running.</strong> This requests fresh read-only observations; it does not modify any external resource.</span></div>` : ""}
          <section class="section">
            <div class="section-heading"><h2>Connections</h2><span>5 configured · credentials never displayed</span></div>
            <div class="data-frame">
              <table aria-label="Connection health">
                <colgroup><col style="width:20%"><col style="width:13%"><col style="width:16%"><col style="width:16%"><col style="width:17%"><col style="width:18%"></colgroup>
                <thead><tr><th>Connection</th><th>Health</th><th>Last success</th><th>Last attempt</th><th>Next schedule</th><th>Coverage</th></tr></thead>
                <tbody>${connections.map((connection) => `<tr class="selectable ${state.selected.type === "connection" && state.selected.id === connection.id ? "selected" : ""}" tabindex="0" data-select-type="connection" data-select-id="${connection.id}">
                  <td><span class="cell-primary">${icon("plug", "kind-icon")}<span>${connection.name}<small style="display:block;color:var(--label-muted)">${connection.connector}</small></span></span></td>
                  <td>${badge(connection.health)}</td><td class="mono">${connection.lastSuccess}</td><td class="mono">${connection.lastAttempt}</td><td class="mono">${connection.next}</td><td>${badge(connection.coverage)}</td>
                </tr>`).join("")}</tbody>
              </table>
            </div>
          </section>
          <section class="section">
            <div class="section-heading"><h2>Coverage matrix</h2><span>Connector capability · not run success</span></div>
            <div class="data-frame">
              <table class="coverage-matrix" aria-label="Connector coverage matrix">
                <thead><tr><th>Resource module</th><th>GitHub</th><th>Dokploy</th><th>Cloudflare</th><th>Supabase</th><th>SSH</th></tr></thead>
                <tbody>
                  <tr><td>Identity & inventory</td><td class="coverage-state good">supported</td><td class="coverage-state good">supported</td><td class="coverage-state good">supported</td><td class="coverage-state good">supported</td><td class="coverage-state good">supported</td></tr>
                  <tr><td>Deployments & runtime</td><td class="coverage-state good">supported</td><td class="coverage-state good">supported</td><td class="coverage-state unknown">unsupported</td><td class="coverage-state warn">partial</td><td class="coverage-state warn">partial</td></tr>
                  <tr><td>Relations & routing</td><td class="coverage-state warn">partial</td><td class="coverage-state good">supported</td><td class="coverage-state warn">partial</td><td class="coverage-state warn">partial</td><td class="coverage-state warn">partial</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>`;
      }

      function renderSettings() {
        return `<div class="page">
          ${pageHeader("This Mac · local configuration only", "Settings", "Runtime lifecycle, retention and diagnostic controls. External resources cannot be changed here.")}
          <div class="notice">${icon("shield")}<span><strong>Explicit exit suppression is active only after Quit.</strong> An agent cannot clear <span class="mono">user_quit</span>; opening the app yourself restores normal startup behavior.</span></div>
          <div class="settings-list">
            ${settingsRow("Start at login", "Allow Next Infra Desktop Host to start after this user logs in.", `<button class="switch" role="switch" aria-checked="${state.settings.login}" data-setting="login" aria-label="Start at login"></button>`)}
            ${settingsRow("Allow MCP auto-launch", "Let the local MCP Bridge request Desktop Host startup when it is unavailable. Independent from login startup.", `<button class="switch" role="switch" aria-checked="${state.settings.mcp}" data-setting="mcp" aria-label="Allow MCP auto-launch"></button>`)}
            ${settingsRow("Retention", "Keep committed ResourceVersion, RelationVersion and Change history locally.", `<select class="control" aria-label="Retention"><option>90 days</option><option>30 days</option><option>180 days</option></select>`)}
            ${settingsRow("Data budget", "Bound SQLite growth; maintenance never removes the current projection.", `<select class="control" aria-label="Data budget"><option>512 MiB</option><option>1 GiB</option><option>2 GiB</option></select>`)}
            ${settingsRow("Diagnostic export", "Create a redacted local bundle. Secret values and raw credentials are never included.", `<button class="control-button" id="export-diagnostics">Export redacted bundle</button>`)}
            ${settingsRow("Host status", "The Desktop Host is currently running and accepting versioned Local RPC on this Mac.", `<span class="badge good">active</span>`)}
          </div>
        </div>`;
      }

      function settingsRow(title, description, control) {
        return `<div class="settings-row"><div class="settings-copy"><strong>${title}</strong><p>${description}</p></div><div class="settings-control">${control}</div></div>`;
      }

      const renderers = { overview: renderOverview, inventory: renderInventory, topology: renderTopology, timeline: renderTimeline, connectors: renderConnectors, settings: renderSettings };

      function renderInspector() {
        const inspector = document.getElementById("inspector");
        const shell = document.getElementById("app-shell");
        inspector.classList.toggle("hidden", !state.inspectorOpen);
        shell.classList.toggle("inspector-closed", !state.inspectorOpen);
        if (!state.inspectorOpen) return;

        let model;
        if (state.selected.type === "issue") {
          const issue = issues.find((item) => item.id === state.selected.id) || issues[0];
          const resource = resources.find((item) => item.id === issue.resourceId);
          model = {
            kicker: issue.dimension,
            title: issue.issue,
            subtitle: `${resource.kind} / ${resource.name}`,
            summary: issue.detail,
            facts: [["Resource Health", resource.health], ["Freshness", resource.freshness], ["Connector Health", issue.id === "issue-connector" ? "unreachable" : "healthy"], ["observed_at", `2026-08-02 ${resource.observed} +08:00`]],
            spine: [["Provider / Connection", resource.connection, "read-only Connection"], ["Observation", `SyncRun ${issue.id === "issue-app" ? "#1842" : "#1839"}`, `observed ${resource.observed}`], ["Current projection", `${resource.kind} / ${resource.name}`, `Resource Health ${resource.health}`], ["Attention fact", issue.issue, `${issue.dimension} · age ${issue.age}`]]
          };
        } else if (state.selected.type === "resource") {
          const resource = resources.find((item) => item.id === state.selected.id) || resources[0];
          model = {
            kicker: "Resource current projection",
            title: resource.name,
            subtitle: `${resource.kind} · ${resource.scope}`,
            summary: resource.lifecycle === "tombstoned" ? "This resource remains visible because two authoritative observations no longer contained it. No external deletion was performed." : "Normalized current fact with bounded one-hop relations and committed provenance.",
            facts: [["Resource Health", resource.health], ["Freshness", resource.freshness], ["Lifecycle", resource.lifecycle], ["Connection", resource.connection], ["observed_at", `2026-08-02 ${resource.observed} +08:00`]],
            spine: [["Provider / Connection", resource.connection, "Connector descriptor v1"], ["Observation", "SyncRun #1842", `observed ${resource.observed}`], ["Current projection", `${resource.kind} / ${resource.name}`, `fingerprint 7f3c9d1`], ["Relations", "2 upstream · 2 downstream", "provider 2 · configured 1 · inferred 1"]]
          };
        } else if (state.selected.type === "change") {
          const change = changes.find((item) => item.id === state.selected.id) || changes[0];
          const resource = resources.find((item) => item.id === change.resourceId);
          model = {
            kicker: "Structured Change",
            title: change.summary,
            subtitle: `${change.origin} ${change.run} · ${change.time} +08:00`,
            summary: `${change.path} changed from “${change.before}” to “${change.after}”. Large before/after payloads remain collapsed in this prototype.`,
            facts: [["Origin", change.origin], ["Resource", resource.name], ["Field path", change.path], ["Before", change.before], ["After", change.after]],
            spine: [["Origin", `${change.origin} ${change.run}`, "stable provenance reference"], ["Committed version", "ResourceVersion #442", `2026-08-02 ${change.time} +08:00`], ["Change", change.path, `${change.before} → ${change.after}`], ["Current projection", resource.name, `${resource.health} · ${resource.freshness}`]]
          };
        } else if (state.selected.type === "connection") {
          const connection = connections.find((item) => item.id === state.selected.id) || connections[0];
          model = {
            kicker: "Connection & coverage",
            title: connection.name,
            subtitle: `${connection.connector} ReadConnector`,
            summary: connection.detail,
            facts: [["Connector Health", connection.health], ["Last success", connection.lastSuccess], ["Last attempt", connection.lastAttempt], ["Next schedule", connection.next], ["Coverage", connection.coverage]],
            spine: [["Connector", connection.connector, "compiled read-only adapter"], ["Connection", connection.name, "SecretRef stored; value hidden"], ["Latest SyncRun", connection.health === "unreachable" ? "#1839 failed" : "#1842 succeeded", `last success ${connection.lastSuccess}`], ["Coverage", connection.coverage, connection.detail]]
          };
        } else if (state.selected.type === "relation") {
          const edge = state.selected.id;
          const configured = ["app-host", "dns-app"].includes(edge);
          const inferred = edge === "repo-database" || edge === "host-frontier";
          const evidence = configured ? "configured" : inferred ? "inferred" : "provider";
          const relationNames = {
            "app-host": ["atlas-web", "runs on", "mac-mini-build"],
            "dns-app": ["edge.example.dev", "routes to", "atlas-web"],
            "repo-database": ["atlas-web", "depends on", "supabase-prod"],
            "repo-workflow": ["atlas-web", "triggers", "deploy-production"],
            "workflow-image": ["deploy-production", "publishes", "atlas-web:7f3c9d1"],
            "image-app": ["atlas-web:7f3c9d1", "deploys", "atlas-web"],
            "database-app": ["supabase-prod", "service endpoint", "atlas-web"],
            "host-frontier": ["mac-mini-build", "build target", "runner-legacy"]
          };
          const names = relationNames[edge] || relationNames["app-host"];
          model = {
            kicker: `${evidence} relation evidence`,
            title: `${names[0]} → ${names[2]}`,
            subtitle: `Relation / ${names[1]}`,
            summary: evidence === "configured" ? "This relation was explicitly declared as a local Binding. It does not claim the Provider returned it." : evidence === "inferred" ? "This relation is reproducible from versioned inputs and rule@3; confidence is shown, not treated as provider fact." : "The Provider returned this relation in a committed ObservationBatch.",
            facts: [["Relation kind", names[1]], ["Evidence type", evidence], ["Confidence", evidence === "inferred" ? "0.92" : "1.00"], ["RelationVersion", "#121"], ["observed_at", "2026-08-02 10:41:59 +08:00"]],
            spine: evidence === "configured" ? [["Binding", "binding-17", "created 2026-08-01 21:14"], ["RelationVersion", `${names[0]} ${names[1]} ${names[2]}`, "configured evidence"], ["Current projection", names[2], "selected downstream resource"]] : evidence === "inferred" ? [["Inference rule", "rule@3", "inputs ResourceVersion #438, #440"], ["RelationVersion", `${names[0]} ${names[1]} ${names[2]}`, "confidence 0.92"], ["Current projection", names[2], "selected downstream resource"]] : [["Provider / Connection", "github-main", "field path deployment.image"], ["Observation", "SyncRun #1842", "observed 10:41:59"], ["RelationVersion", `${names[0]} ${names[1]} ${names[2]}`, "provider evidence"], ["Current projection", names[2], "selected downstream resource"]]
          };
        }

        inspector.innerHTML = `<div class="inspector-head"><h2>Evidence Spine</h2><button class="icon-button" id="close-inspector" aria-label="Close inspector">${icon("x")}</button></div>
          <div class="inspector-body"><div class="inspect-kicker">${model.kicker}</div><h3 class="inspect-title">${model.title}</h3><div class="inspect-subtitle">${model.subtitle}</div><p class="inspect-summary">${model.summary}</p>
          <section class="inspect-section"><h3>Current facts</h3><dl class="fact-list">${model.facts.map(([key, value]) => `<div class="fact-row"><dt>${key}</dt><dd class="${semanticClass(value)}">${value}</dd></div>`).join("")}</dl></section>
          <section class="inspect-section"><h3>Evidence path</h3><div class="spine">${model.spine.map(([label, value, meta], index) => `<div class="spine-step ${index === model.spine.length - 1 ? "active" : ""}"><div class="spine-label">${label}</div><div class="spine-value">${value}</div><div class="spine-meta">${meta}</div></div>`).join("")}</div></section></div>`;
      }

      function render() {
        document.querySelectorAll(".nav-button").forEach((button) => button.classList.toggle("active", button.dataset.view === state.view));
        document.getElementById("context-title").textContent = contextLabels[state.view];
        document.getElementById("main-canvas").innerHTML = renderers[state.view]();
        renderInspector();
      }

      function setView(view) {
        if (!renderers[view]) return;
        state.view = view;
        const defaults = {
          overview: { type: "issue", id: "issue-app" },
          inventory: { type: "resource", id: "repo" },
          topology: { type: "relation", id: state.topologySelection.id },
          timeline: { type: "change", id: "change-1" },
          connectors: { type: "connection", id: "cloudflare" }
        };
        if (defaults[view]) {
          state.selected = defaults[view];
          state.inspectorOpen = true;
        } else if (view === "settings") {
          state.inspectorOpen = false;
        }
        render();
        document.getElementById("main-canvas").scrollTop = 0;
      }

      function selectItem(type, id) {
        state.selected = { type, id };
        state.inspectorOpen = true;
        render();
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.hidden = false;
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => { toast.hidden = true; }, 2600);
      }

      document.addEventListener("click", (event) => {
        const nav = event.target.closest("[data-view]");
        if (nav) return setView(nav.dataset.view);
        const target = event.target.closest("[data-view-target]");
        if (target) return setView(target.dataset.viewTarget);
        const selectable = event.target.closest("[data-select-type]");
        if (selectable) return selectItem(selectable.dataset.selectType, selectable.dataset.selectId);
        const topology = event.target.closest("[data-topology-type]");
        if (topology) {
          state.topologySelection = { type: topology.dataset.topologyType, id: topology.dataset.topologyId };
          state.selected = { type: topology.dataset.topologyType === "edge" ? "relation" : "resource", id: topology.dataset.topologyId };
          state.inspectorOpen = true;
          return render();
        }
        if (event.target.closest("#close-inspector")) {
          state.inspectorOpen = false;
          return renderInspector();
        }
        const filter = event.target.closest("[data-filter]");
        if (filter) {
          state.inventoryFilter = filter.dataset.filter;
          return render();
        }
        const setting = event.target.closest("[data-setting]");
        if (setting) {
          state.settings[setting.dataset.setting] = !state.settings[setting.dataset.setting];
          showToast(`${setting.dataset.setting === "login" ? "Start at login" : "MCP auto-launch"} ${state.settings[setting.dataset.setting] ? "enabled" : "disabled"}.`);
          return render();
        }
        if (event.target.closest("#expand-frontier")) {
          state.topologyExpanded = true;
          state.topologyDepth = 2;
          showToast("Depth 2 loaded within the 200-node hard limit.");
          return render();
        }
        if (event.target.closest("#manual-sync")) {
          state.syncStatus = "running";
          render();
          showToast("SyncRun #1843 started — read-only provider observations requested.");
          window.setTimeout(() => {
            state.syncStatus = "idle";
            render();
            showToast("SyncRun #1843 succeeded with partial Cloudflare coverage.");
          }, 4500);
          return;
        }
        if (event.target.closest("#export-diagnostics")) showToast("Prototype only: redacted diagnostic export would be created locally.");
      });

      document.addEventListener("change", (event) => {
        if (event.target.id === "depth-control") {
          state.topologyDepth = Number(event.target.value);
          state.topologyExpanded = state.topologyDepth === 2;
          render();
        }
      });

      document.addEventListener("keydown", (event) => {
        const actionable = event.target.closest("tr[tabindex='0'], g[tabindex='0']");
        if (actionable && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          actionable.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          document.getElementById("global-search-input").focus();
        }
        if (event.key === "Escape") {
          const input = document.getElementById("global-search-input");
          input.value = "";
          document.getElementById("search-results").hidden = true;
        }
      });

      const searchInput = document.getElementById("global-search-input");
      searchInput.addEventListener("input", (event) => {
        const query = event.target.value.trim().toLowerCase();
        const results = document.getElementById("search-results");
        state.searchQuery = query;
        if (!query) {
          results.hidden = true;
          return;
        }
        const matches = resources.filter((resource) => [resource.name, resource.kind, resource.connection, resource.scope].join(" ").toLowerCase().includes(query)).slice(0, 5);
        results.innerHTML = matches.length ? matches.map((resource) => `<button class="search-result" data-search-id="${resource.id}"><span>${resource.name}<small style="display:block">${resource.kind}</small></span><small>${resource.connection}</small></button>`).join("") : `<div style="padding:12px;color:var(--label-muted);font-size:10px">No matching resources. Query completed locally.</div>`;
        results.hidden = false;
      });

      document.getElementById("search-results").addEventListener("click", (event) => {
        const result = event.target.closest("[data-search-id]");
        if (!result) return;
        state.view = "inventory";
        state.selected = { type: "resource", id: result.dataset.searchId };
        state.inspectorOpen = true;
        searchInput.value = "";
        document.getElementById("search-results").hidden = true;
        render();
      });

      render();
    </script>
  </body>
</html>
