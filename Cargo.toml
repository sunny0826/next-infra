[workspace]
members = [
  "crates/next-infra-core",
  "crates/next-infra-store",
  "crates/next-infra-connector-api",
  "crates/next-infra-normalizer",
  "crates/next-infra-connector-fixture",
  "crates/next-infra-connector-contract-tests",
  "crates/next-infra-connector-catalog",
  "crates/next-infra-sync",
  "crates/next-infra-query",
  "crates/next-infra-runtime",
  "crates/next-infra-local-rpc",
  "crates/next-infra-mcp",
  "apps/desktop/src-tauri",
  "apps/mcp-bridge",
  "tests/integration/store-sync",
  "tests/integration/connector-pipeline",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
publish = false

[workspace.dependencies]
next-infra-core = { path = "crates/next-infra-core", version = "=0.1.0" }
next-infra-store = { path = "crates/next-infra-store", version = "=0.1.0" }
next-infra-connector-api = { path = "crates/next-infra-connector-api", version = "=0.1.0" }
next-infra-normalizer = { path = "crates/next-infra-normalizer", version = "=0.1.0" }
next-infra-connector-fixture = { path = "crates/next-infra-connector-fixture", version = "=0.1.0" }
next-infra-connector-contract-tests = { path = "crates/next-infra-connector-contract-tests", version = "=0.1.0" }
next-infra-connector-catalog = { path = "crates/next-infra-connector-catalog", version = "=0.1.0" }
next-infra-sync = { path = "crates/next-infra-sync", version = "=0.1.0" }
next-infra-query = { path = "crates/next-infra-query", version = "=0.1.0" }
next-infra-runtime = { path = "crates/next-infra-runtime", version = "=0.1.0" }
next-infra-local-rpc = { path = "crates/next-infra-local-rpc", version = "=0.1.0" }
next-infra-mcp = { path = "crates/next-infra-mcp", version = "=0.1.0" }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-build = { version = "=2.6.3" }
tauri-plugin-single-instance = { version = "=2.4.3" }
tauri-plugin-autostart = { version = "=2.5.1" }
tauri-plugin-opener = { version = "=2.5.4" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
libc = { version = "=0.2.189" }
ts-rs = { version = "=12.0.1" }
async-trait = { version = "=0.1.91" }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
tempfile = { version = "=3.27.0" }
sha2 = { version = "=0.11.0" }
core-foundation = { version = "=0.10.1" }
block2 = { version = "=0.6.2" }
objc2 = { version = "=0.6.4" }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "LAContext"] }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.17.0", features = ["OSX_10_15"] }
